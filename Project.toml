[compat]
Aqua = "0.8"
# 0.8.4 is the floor, not a preference: `observe_sources` and `mark_done!(…; observation)` arrived
# there, and `save!` returning the digest it wrote (with `mark_done!(…; result)`) in 0.8.3. `artifact!` / `ArtifactBusy`
# (what the deferral and `artifact_affinity` are built for) came in 0.8.2. The owner-stamped
# `.running` API (`new_owner_token`, `running_owner`, and the three-argument `refresh_running!` /
# `clear_running!`) that the liveness reaper is built on arrived in 0.8.1. 0.8.9 is the floor now:
# the key heartbeat is `start_heartbeat`'s child process, and a commit is `mark_done!(…, owner)`.
